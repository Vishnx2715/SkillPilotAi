services:
  - type: web
    name: skillpilot-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-2-1212
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:3000
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: UPLOAD_DIR
        value: /tmp/uploads
