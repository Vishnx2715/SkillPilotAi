services:
  - type: web
    name: skillpilot-backend
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Paste your Supabase connection string here in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-2-1212
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:3000
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: UPLOAD_DIR
        value: /tmp/uploads
